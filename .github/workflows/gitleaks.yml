name: gitleaks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          # 릴리스 파일이 바뀌었거나 변조됐다면 SHA-256 불일치로 중단한다
          GITLEAKS_SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          GITLEAKS_TGZ="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$GITLEAKS_TGZ" "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${GITLEAKS_TGZ}" | sha256sum -c -
          tar -xz -C /usr/local/bin -f "$GITLEAKS_TGZ" gitleaks
      - name: Scan full history
        run: gitleaks git . --redact --verbose
